
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify application imports
        run: |
          python -c "import sys; print(sys.path)"
          python -c "from app.payouts.calculator import calculate_trip_fare; print('Calculator import successful')"
          python -c "from app.data import DataStore; print('DataStore import successful')"

      - name: Run tests
        run: python -m pytest -q
