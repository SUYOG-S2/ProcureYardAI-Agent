# Starter file. Add your own services (your app, Postgres) next to payswift. Leave payswift as it is.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickdrop
      POSTGRES_USER: quickdrop
      POSTGRES_PASSWORD: quickdrop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdrop -d quickdrop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://quickdrop:quickdrop@postgres:5432/quickdrop
      PAYSWIFT_BASE_URL: http://payswift:8081
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
      payswift:
        condition: service_started

  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

volumes:
  postgres_data:
